name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build TallySyncConnector.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconsole --onefile --name TallySyncConnector tally_sync_app.py

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: TallySyncConnector-Windows
          path: |
            Output/TallySyncConnector-Setup.exe
            dist/TallySyncConnector.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/TallySyncConnector-Setup.exe
            dist/TallySyncConnector.exe
